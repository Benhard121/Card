<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spesial Buat Kamu</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Background particles -->
    <div id="particles"></div>

    <!-- Objek camber alarg -->
    <div class="ambient" aria-hidden="true"></div>

    <!-- Musik latar -->
    <audio id="bgMusic" src="music.mp3" loop preload="auto"></audio>

    <!-- HALAMAN AMPL0P -->
    <main id="stageEnvelope" class="stage active">

        <!-- Garlands de luces -->
        <div id="bunting" aria-hidden="true"></div>

        <!-- Balon naik-naik -->
        <div class="balloons" aria-hidden="true">
            <span class="balloon b1">🎈</span>
            <span class="balloon b2">🎈</span>
            <span class="balloon b3">🎈</span>
        </div>

        <div
            class="envelope-wrapper"
            id="openEnvelope"
            role="button"
            tabindex="0"
        >

            <div class="envelope-text">
                Klik untuk membuka 💌
            </div>

            <div class="envelope">

                <div class="envelope-flap"></div>

                <div class="envelope-body"></div>

                <div class="heart">
                    ♥
                </div>

                <div class="wax-seal" aria-hidden="true">💌</div>

            </div>

        </div>

    </main>


    <!-- HALAMAN PESAN -->
    <main id="stageLetter" class="stage">

        <section class="letter-card">

            <span class="card-flower tl" aria-hidden="true">🌷</span>
            <span class="card-flower br" aria-hidden="true">🌷</span>

            <button
                id="closeLetter"
                class="close-btn"
                aria-label="Tutup"
            >
                ×
            </button>

            <div class="letter-icon">
                💗
            </div>

            <h1>
                Spesial Buat Kamu
            </h1>

            <p
                id="typedText"
                class="message"
            ></p>

            <button
                id="replay"
                class="replay-btn"
            >
                Buka Lagi 💌
            </button>

            </section>

    </main>


    <!-- HALAMAN BONEKA (SURPRISE) -->
    <main id="stageSurprise" class="stage">

        <section class="surprise-card">

            <span class="card-flower tl" aria-hidden="true">🌷</span>
            <span class="card-flower br" aria-hidden="true">🌷</span>
            <span class="card-sparkle s1" aria-hidden="true">✧</span>
            <span class="card-sparkle s2" aria-hidden="true">✧</span>

            <div class="surprise" aria-hidden="true">

                <div class="surprise-heart h1">💗</div>
                <div class="surprise-heart h2">💖</div>
                <div class="surprise-heart h3">🌸</div>
                <div class="surprise-heart h4">💘</div>
                <div class="surprise-star s1">⭐</div>
                <div class="surprise-star s2">✧</div>
                <div class="surprise-star s3">✨</div>

                <div class="boneka-wrap">

                    <span class="halo"></span>

                    <span class="boneka b2">🧸</span>

                    <span class="boneka b1">
                        <span class="bow">🎀</span>
                        🧸
                    </span>

                    <span class="boneka b3">🧸</span>

                    <span class="gift">🎁</span>

                </div>

            </div>

            <div class="gift-label" aria-hidden="true">
                🎁 Hadiah Istimewa 🎁
            </div>

            <h2 class="surprise-title">
                Tadaaaa! 🎉
            </h2>

            <p class="message">
                Surprise sayang! 🧸💗

                Aku gat nah a boneka kecil aja
                na dlainamu a kamu — keumakan hehe.

                Semoga hari-harimu bagus na,
                e a boneka de kamuu. 💕
            </p>

            <button
                id="back"
                class="replay-btn"
            >
                Balik 💗
            </button>

            </section>

    </main>


    <!-- Tombol musik kecil di pojok -->
    <button
        id="musicToggle"
        class="music-toggle"
        aria-label="Putar atau jeda musik"
        title="Putar musik"
    >
        🎵
    </button>

    <script src="script.js"></script>

</body>
</html>
